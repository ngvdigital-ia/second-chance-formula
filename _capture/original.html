l=\"none\" stroke=\"currentColor\" stroke-width=\"2\"\u003E\u003Cpath d=\"M12 2l8 4v6c0 5-3.5 8-8 10-4.5-2-8-5-8-10V6l8-4z\"\u002F\u003E\u003C\u002Fsvg\u003E\n      180-day guarantee\n    \u003C\u002Fdiv\u003E\n    \u003Cdiv class=\"trust-item\"\u003E\n      \u003Csvg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"\u003E\u003Ccircle cx=\"12\" cy=\"12\" r=\"9\"\u002F\u003E\u003Cpath d=\"M12 7v5l3 3\"\u002F\u003E\u003C\u002Fsvg\u003E\n      Instant access\n    \u003C\u002Fdiv\u003E\n  \u003C\u002Fdiv\u003E\n\n  \u003Cdiv class=\"coupon\" id=\"coupon\"\u003E\n    \u003Cdiv class=\"coupon-title\"\u003E🎁 A gift for the ones who stayed\u003C\u002Fdiv\u003E\n    \u003Cdiv class=\"coupon-text\"\u003EYou didn't make it into the first 200 spots — but here's a special thank-you for staying until the end. Use this code at checkout to unlock 25% off.\u003C\u002Fdiv\u003E\n\n    \u003Cdiv class=\"coupon-code-row\"\u003E\n      \u003Cspan class=\"coupon-code\" id=\"couponCodeText\"\u003E25OFF\u003C\u002Fspan\u003E\n    \u003C\u002Fdiv\u003E\n    \u003Cbutton class=\"coupon-copy-btn\" id=\"couponCopyBtn\" type=\"button\"\u003E\n      \u003Csvg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\"\u003E\u003Crect x=\"9\" y=\"9\" width=\"12\" height=\"12\" rx=\"2\"\u002F\u003E\u003Cpath d=\"M5 15V5a2 2 0 0 1 2-2h10\"\u002F\u003E\u003C\u002Fsvg\u003E\n      \u003Cspan class=\"copy-label\"\u003ECopy code\u003C\u002Fspan\u003E\n    \u003C\u002Fbutton\u003E\n\n    \u003Cdiv class=\"coupon-scarcity\"\u003E\n      \u003Cdiv class=\"coupon-scarcity-top\"\u003E\n        \u003Cspan class=\"coupon-scarcity-label\"\u003ESpecial offer spots\u003C\u002Fspan\u003E\n        \u003Cspan class=\"coupon-scarcity-count\"\u003E\u003Cb id=\"couponSpotsNum\"\u003E10\u003C\u002Fb\u003E \u002F 10 left\u003C\u002Fspan\u003E\n      \u003C\u002Fdiv\u003E\n      \u003Cdiv class=\"fuse-track\"\u003E\n        \u003Cdiv class=\"fuse-fill\" id=\"couponFuseFill\"\u003E\u003C\u002Fdiv\u003E\n      \u003C\u002Fdiv\u003E\n    \u003C\u002Fdiv\u003E\n\n    \u003Col class=\"coupon-steps\"\u003E\n      \u003Cli\u003ECopy the code above.\u003C\u002Fli\u003E\n      \u003Cli\u003EWhen the button appears on the video, tap it to go to checkout.\u003C\u002Fli\u003E\n      \u003Cli\u003EPaste the code in the \u003Cb\u003ECoupon\u003C\u002Fb\u003E field to apply your 25% off.\u003C\u002Fli\u003E\n    \u003C\u002Fol\u003E\n\n    \u003Cdiv class=\"coupon-reminder\"\u003E⚠️ Copy the code now — without it at checkout, the discount won't be applied.\u003C\u002Fdiv\u003E\n  \u003C\u002Fdiv\u003E\n\n  \u003Cfooter\u003E\n    © 2026 Diego Raze — All rights reserved.\n  \u003C\u002Ffooter\u003E\n\u003C\u002Fdiv\u003E\n\n\u003Cdiv class=\"toast-host\" id=\"toastHost\"\u003E\u003C\u002Fdiv\u003E\n\n\u003Cscript\u003E\n(function(){\n  \u002F\u002F ---------- CONFIG ----------\n  \u002F\u002F Timings below are synced to the actual VSL runtime (mm:ss of page\u002Fvideo viewing time):\n  \u002F\u002F   32:08 -\u003E the 200-spot counter appears\n  \u002F\u002F   40:20 -\u003E the 200 spots are fully gone\n  \u002F\u002F   40:32 -\u003E the coupon card appears (12s after spots close)\n  \u002F\u002F   41:58 -\u003E the coupon countdown settles at 1 spot left\n  var SCARCITY_START_MS    = 1928 * 1000; \u002F\u002F 32:08 -\u003E counter appears\n  var SCARCITY_DURATION_MS = 492  * 1000; \u002F\u002F 32:08 -\u003E 40:20 (200 spots fill up)\n  var FIRST_NOTIFICATION_DELAY_MS = 10 * 1000; \u002F\u002F wait 10s after the counter appears before the first sale shows up\n  var TOTAL_SPOTS = 200;\n  var TOAST_VISIBLE_MS = 3400;\n\n  var COUPON_DELAY_AFTER_CLOSE_MS = 12 * 1000; \u002F\u002F 40:20 -\u003E 40:32\n  var COUPON_TOTAL = 10;                       \u002F\u002F the special-offer has 10 spots, ending at 1 left\n  var COUPON_EVENTS_DURATION_MS = 86 * 1000;   \u002F\u002F 40:32 -\u003E 41:58 (10 -\u003E 1 remaining)\n\n  \u002F\u002F ---------- DATA ----------\n  var names = [\"James\",\"Michael\",\"Robert\",\"John\",\"David\",\"William\",\"Richard\",\"Joseph\",\"Thomas\",\"Christopher\",\n    \"Daniel\",\"Matthew\",\"Anthony\",\"Mark\",\"Paul\",\"Steven\",\"Andrew\",\"Kenneth\",\"George\",\"Joshua\",\n    \"Kevin\",\"Brian\",\"Edward\",\"Ronald\",\"Timothy\",\"Jason\",\"Jeffrey\",\"Ryan\",\"Jacob\",\"Gary\",\n    \"Nicholas\",\"Eric\",\"Jonathan\",\"Stephen\",\"Larry\",\"Justin\",\"Scott\",\"Brandon\",\"Benjamin\",\"Samuel\",\n    \"Frank\",\"Gregory\",\"Raymond\",\"Alexander\",\"Patrick\",\"Jack\",\"Dennis\",\"Jerry\",\"Tyler\",\"Aaron\"];\n\n  var cities = [\n    {c:\"Austin, TX\"},{c:\"Denver, CO\"},{c:\"Phoenix, AZ\"},{c:\"Charlotte, NC\"},{c:\"Columbus, OH\"},\n    {c:\"Seattle, WA\"},{c:\"Nashville, TN\"},{c:\"Tampa, FL\"},{c:\"Sacramento, CA\"},{c:\"Portland, OR\"},\n    {c:\"Kansas City, MO\"},{c:\"Indianapolis, IN\"},{c:\"Raleigh, NC\"},{c:\"Orlando, FL\"},{c:\"Cincinnati, OH\"},\n    {c:\"Manchester, UK\"},{c:\"Birmingham, UK\"},{c:\"Leeds, UK\"},{c:\"Bristol, UK\"},{c:\"Liverpool, UK\"},\n    {c:\"Glasgow, UK\"},{c:\"Sheffield, UK\"},\n    {c:\"Berlin, DE\"},{c:\"Munich, DE\"},{c:\"Hamburg, DE\"},{c:\"Cologne, DE\"},\n    {c:\"Lyon, FR\"},{c:\"Marseille, FR\"},{c:\"Toulouse, FR\"},\n    {c:\"Madrid, ES\"},{c:\"Valencia, ES\"},{c:\"Seville, ES\"},\n    {c:\"Milan, IT\"},{c:\"Rome, IT\"},{c:\"Turin, IT\"},\n    {c:\"Amsterdam, NL\"},{c:\"Rotterdam, NL\"},\n    {c:\"Stockholm, SE\"},{c:\"Gothenburg, SE\"},\n    {c:\"Warsaw, PL\"},{c:\"Krakow, PL\"},\n    {c:\"Dublin, IE\"},\n    {c:\"Sydney, AU\"},{c:\"Melbourne, AU\"},{c:\"Brisbane, AU\"},{c:\"Perth, AU\"},{c:\"Adelaide, AU\"}\n  ];\n  \u002F\u002F 50 names x 47 cities, coprime lengths -\u003E first 200 (name,city) pairs are guaranteed unique\n  var buyers = [];\n  for (var i = 0; i \u003C TOTAL_SPOTS; i++){\n    buyers.push({ name: names[i % names.length], city: cities[i % cities.length].c });\n  }\n  \u002F\u002F shuffle reveal order\n  for (var j = buyers.length - 1; j \u003E 0; j--){\n    var k = Math.floor(Math.random() * (j + 1));\n    var tmp = buyers[j]; buyers[j] = buyers[k]; buyers[k] = tmp;\n  }\n\n  \u002F\u002F schedule 200 purchase timestamps spread with jitter across the window\n  var schedule = [];\n  (function build(){\n    var weights = [];\n    var sum = 0;\n    for (var i = 0; i \u003C TOTAL_SPOTS; i++){\n      var w = 0.55 + Math.random(); \u002F\u002F 0.55–1.55\n      weights.push(w); sum += w;\n    }\n    var cum = 0;\n    for (var i = 0; i \u003C TOTAL_SPOTS; i++){\n      cum += weights[i];\n      schedule.push(SCARCITY_START_MS + FIRST_NOTIFICATION_DELAY_MS + (cum \u002F sum) * (SCARCITY_DURATION_MS - FIRST_NOTIFICATION_DELAY_MS));\n    }\n  })();\n\n  \u002F\u002F ---------- MAP THUMBNAIL (generated, free, no API) ----------\n  function mapSvg(seed){\n    var rx = 16 + (seed * 7 % 16);\n    var ry = 16 + (seed * 13 % 14);\n    return '\u003Csvg viewBox=\"0 0 46 46\" xmlns=\"http:\u002F\u002Fwww.w3.org\u002F2000\u002Fsvg\"\u003E' +\n      '\u003Crect width=\"46\" height=\"46\" fill=\"#DCE7DC\"\u002F\u003E' +\n      '\u003Cpath d=\"M-2 8 L48 8 M-2 18 L48 18 M-2 28 L48 28 M-2 38 L48 38\" stroke=\"#C3D2C4\" stroke-width=\"1\"\u002F\u003E' +\n      '\u003Cpath d=\"M8 -2 L8 48 M18 -2 L18 48 M28 -2 L28 48 M38 -2 L38 48\" stroke=\"#C3D2C4\" stroke-width=\"1\"\u002F\u003E' +\n      '\u003Cpath d=\"M-2 14 Q 14 24 24 16 T 48 20\" stroke=\"#AEC6E8\" stroke-width=\"3\" fill=\"none\" opacity=\"0.85\"\u002F\u003E' +\n      '\u003Cg transform=\"translate(' + rx + ',' + ry + ')\"\u003E' +\n        '\u003Cpath d=\"M0,-13 C6,-13 9,-8.5 9,-4.5 C9,1 0,10 0,10 C0,10 -9,1 -9,-4.5 C-9,-8.5 -6,-13 0,-13 Z\" fill=\"#E43D2F\" stroke=\"#ffffff\" stroke-width=\"1.4\"\u002F\u003E' +\n        '\u003Ccircle cx=\"0\" cy=\"-4.5\" r=\"3.2\" fill=\"#ffffff\"\u002F\u003E' +\n      '\u003C\u002Fg\u003E' +\n      '\u003C\u002Fsvg\u003E';\n  }\n\n  \u002F\u002F ---------- SCARCITY UI ----------\n  var scarcityEl = document.getElementById('scarcity');\n  var spotsNumEl = document.getElementById('spotsNum');\n  var fuseFillEl = document.getElementById('fuseFill');\n  var fuseSparkEl = document.getElementById('fuseSpark');\n  var remaining = TOTAL_SPOTS;\n\n  function updateFuse(){\n    var pct = (remaining \u002F TOTAL_SPOTS) * 100;\n    fuseFillEl.style.width = pct + '%';\n    fuseSparkEl.style.right = (100 - pct) + '%';\n    spotsNumEl.textContent = remaining;\n  }\n  updateFuse();\n\n  var trustRowEl = document.getElementById('trustRow');\n\n  function showScarcity(){\n    scarcityEl.classList.add('visible');\n    trustRowEl.classList.add('visible');\n  }\n\n  function closeScarcity(){\n    scarcityEl.classList.add('closed');\n    setTimeout(startCouponFlow, COUPON_DELAY_AFTER_CLOSE_MS);\n  }\n\n  \u002F\u002F ---------- TOAST UI ----------\n  var toastHost = document.getElementById('toastHost');\n  var toastEl = null;\n  var toastTimer = null;\n\n  function showToast(buyer, isCoupon){\n    if (toastEl) toastEl.remove();\n    var t = document.createElement('div');\n    t.className = 'toast' + (isCoupon ? ' toast-coupon' : '');\n    var actionText = isCoupon\n      ? '🎁 Just secured the 25% OFF deal!'\n      : 'Just joined The Second Chance Formula!';\n    var metaText = isCoupon\n      ? 'Applied 25OFF at checkout'\n      : 'Just now';\n    t.innerHTML =\n      '\u003Cdiv class=\"toast-map\"\u003E' + mapSvg(buyer.name.length + buyer.city.length) + '\u003C\u002Fdiv\u003E' +\n      '\u003Cdiv class=\"toast-body\"\u003E' +\n        '\u003Cdiv class=\"toast-name\"\u003E' + buyer.name + ' from ' + buyer.city + '\u003C\u002Fdiv\u003E' +\n        '\u003Cdiv class=\"toast-action\"\u003E' + actionText + '\u003C\u002Fdiv\u003E' +\n        '\u003Cdiv class=\"toast-meta\"\u003E' + metaText + ' &nbsp;·&nbsp; \u003Cspan class=\"toast-verified\"\u003E\u003Csvg width=\"11\" height=\"11\" viewBox=\"0 0 24 24\" fill=\"currentColor\"\u003E\u003Cpath d=\"M12 2l2.4 4.86L20 8l-4 3.9.94 5.5L12 15l-4.94 2.4L8 11.9 4 8l5.6-1.14L12 2z\"\u002F\u003E\u003C\u002Fsvg\u003Everified by Proof\u003C\u002Fspan\u003E' +\n      '\u003C\u002Fdiv\u003E';\n    toastHost.appendChild(t);\n    toastEl = t;\n    void t.offsetWidth; \u002F\u002F force reflow so the transition below always plays\n    requestAnimationFrame(function(){\n      requestAnimationFrame(function(){ t.classList.add('show'); });\n    });\n    clearTimeout(toastTimer);\n    toastTimer = setTimeout(function(){\n      t.classList.remove('show');\n    }, TOAST_VISIBLE_MS);\n  }\n\n  \u002F\u002F ---------- MAIN TIMELINE ----------\n  var startedAt = Date.now();\n  var nextIndex = 0;\n\n  setTimeout(showScarcity, SCARCITY_START_MS);\n\n  var tickHandle = setInterval(function(){\n    var elapsed = Date.now() - startedAt;\n    while (nextIndex \u003C schedule.length && elapsed \u003E= schedule[nextIndex]){\n      remaining = Math.max(0, remaining - 1);\n      updateFuse();\n      showToast(buyers[nextIndex]);\n      nextIndex++;\n    }\n    if (nextIndex \u003E= schedule.length){\n      clearInterval(tickHandle);\n      closeScarcity();\n    }\n  }, 350);\n\n  \u002F\u002F ---------- COUPON FLOW (triggered after the 200 spots close) ----------\n  var couponEl = document.getElementById('coupon');\n  var couponSpotsNumEl = document.getElementById('couponSpotsNum');\n  var couponFuseFillEl = document.getElementById('couponFuseFill');\n  var couponRemaining = COUPON_TOTAL;\n\n  function updateCouponFuse(){\n    var pct = (couponRemaining \u002F COUPON_TOTAL) * 100;\n    couponFuseFillEl.style.width = pct + '%';\n    couponSpotsNumEl.textContent = couponRemaining;\n  }\n  updateCouponFuse();\n\n  function revealCoupon(){\n    couponEl.classList.add('show');\n    setTimeout(function(){\n      couponEl.scrollIntoView({ behavior: 'smooth', block: 'center' });\n    }, 300);\n  }\n\n  function startCouponFlow(){\n    revealCoupon();\n\n    \u002F\u002F Build a small pool of buyers exclusive to the coupon notifications\n    \u002F\u002F (continues past index 200 in the same name\u002Fcity sequence, so it never\n    \u002F\u002F repeats a name or city already shown in the main 200-spot notifications)\n    var couponEventsCount = COUPON_TOTAL - 1; \u002F\u002F goes from 10 down to 1, never hits 0\n    var couponBuyers = [];\n    for (var i = 0; i \u003C couponEventsCount; i++){\n      var idx = TOTAL_SPOTS + i;\n      couponBuyers.push({ name: names[idx % names.length], city: cities[idx % cities.length].c });\n    }\n    for (var j = couponBuyers.length - 1; j \u003E 0; j--){\n      var k = Math.floor(Math.random() * (j + 1));\n      var tmp = couponBuyers[j]; couponBuyers[j] = couponBuyers[k]; couponBuyers[k] = tmp;\n    }\n\n    var couponSchedule = [];\n    var weights = [], sum = 0;\n    for (var i = 0; i \u003C couponBuyers.length; i++){\n      var w = 0.5 + Math.random();\n      weights.push(w); sum += w;\n    }\n    var cum = 0;\n    for (var i = 0; i \u003C couponBuyers.length; i++){\n      cum += weights[i];\n      couponSchedule.push((cum \u002F sum) * COUPON_EVENTS_DURATION_MS);\n    }\n\n    var couponStart = Date.now();\n    var couponIdx = 0;\n    var couponTick = setInterval(function(){\n      var elapsed = Date.now() - couponStart;\n      while (couponIdx \u003C couponSchedule.length && elapsed \u003E= couponSchedule[couponIdx]){\n        couponRemaining = Math.max(1, couponRemaining - 1);\n        updateCouponFuse();\n        showToast(couponBuyers[couponIdx], true);\n        couponIdx++;\n      }\n      if (couponIdx \u003E= couponSchedule.length){\n        clearInterval(couponTick);\n      }\n    }, 400);\n  }\n\n  \u002F\u002F ---------- COPY CODE BUTTON ----------\n  document.getElementById('couponCopyBtn').addEventListener('click', function(){\n    var code = document.getElementById('couponCodeText').textContent.trim();\n    var btn = this;\n    var label = btn.querySelector('.copy-label');\n    function done(){\n      var original = label.textContent;\n      label.textContent = 'Copied!';\n      btn.classList.add('copied');\n      setTimeout(function(){ label.textContent = original; btn.classList.remove('copied'); }, 1800);\n    }\n    function fallbackCopy(){\n      var ta = document.createElement('textarea');\n      ta.value = code;\n      ta.style.position = 'fixed';\n      ta.style.opacity = '0';\n      document.body.appendChild(ta);\n      ta.select();\n      try { document.execCommand('copy'); } catch (e) {}\n      document.body.removeChild(ta);\n      done();\n    }\n    if (navigator.clipboard && navigator.clipboard.writeText){\n      navigator.clipboard.writeText(code).then(done).catch(fallbackCopy);\n    } else {\n      fallbackCopy();\n    }\n  });\n})();\n\u003C\u002Fscript\u003E\n\n\u003C\u002Fbody\u003E\n\u003C\u002Fhtml\u003E"},"_owner":null}]},"_owner":null}]},"_owner":null}]},"_owner":null}],"pageSettings":{"language":"pt-BR","badgeAllowed":false,"position":"bottomLeft","launchContent":0,"fonts":[]}},"notification":[],"tenant":{"pageId":"ibhjqzgbiko8std3b2vjhq","tenantId":"clEMbvueoUSfYKNmMN170Q","funnelId":"2e5389b0-8684-4284-8f42-8f9c4a671e43","stepId":"ohypagory0allo7exex0uw","type":"Custom","isSSR":true},"settings":{"url":"razeresearch.com\u002Frazef","version":"0","originStepUrl":"","originStepId":null,"isConversion":false,"accountIsDisabled":false},"checkout":{"orderBumps":[],"errorModal":false,"confirmDataModal":false,"paymentButtonState":"default","step":1,"customFreight":null,"checkoutData":{"name":"","email":"","confirmEmail":"","telephone":{"number":"","dialCode":"+55","countryCode":"br"},"document":{"number":"","countryCode":"br"},"payment_method":"creditCard","multiMeansInstallments":"","creditCard1":{"holder_name":"","number":"","card_expiration":"","cvv":""},"creditCard2":{"holder_name":"","number":"","card_expiration":"","cvv":""},"orderBumps":{"installments":[],"products":[]},"orderSummary":{"totalAmount":0,"items":[],"installments":[],"coupon":null}},"che
