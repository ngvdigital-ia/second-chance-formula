<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Second Chance Formula video presentation.">
  <meta name="robots" content="noindex, nofollow">
  <title>The Second Chance Formula</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --background: #0e0f13;
      --surface: #15171f;
      --text: #f5f1ea;
      --muted: #6e6b68;
      --line: rgba(245, 241, 234, 0.08);
      --ember: #ff6b35;
      --shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      display: flex;
      justify-content: center;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 50% 0%, rgba(255, 107, 53, 0.08), transparent 45%),
        var(--background);
      color: var(--text);
      font-family: "Inter", Arial, sans-serif;
    }

    .page {
      position: relative;
      width: 100%;
      max-width: 460px;
      min-height: 100vh;
      padding: 28px 18px 60px;
    }

    /* Clone brief: source player wrapper is centered, max-width 400px, radius 14px. */
    .video-wrap {
      width: 100%;
      max-width: 400px;
      margin: 0 auto;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #000;
      box-shadow: var(--shadow);
    }

    .video-placeholder {
      position: relative;
      display: grid;
      width: 100%;
      aspect-ratio: 16 / 9;
      place-items: center;
      background:
        radial-gradient(circle at 50% 45%, rgba(255, 107, 53, 0.12), transparent 34%),
        linear-gradient(145deg, #111318, #050506);
    }

    .video-placeholder::after {
      position: absolute;
      inset: 10px;
      border: 1px solid rgba(245, 241, 234, 0.04);
      border-radius: 9px;
      content: "";
      pointer-events: none;
    }

    .placeholder-content {
      display: grid;
      max-width: 250px;
      gap: 10px;
      justify-items: center;
      padding: 20px;
      text-align: center;
    }

    .placeholder-icon {
      display: grid;
      width: 44px;
      height: 44px;
      border: 1px solid rgba(255, 107, 53, 0.35);
      border-radius: 50%;
      place-items: center;
      color: var(--ember);
      background: rgba(255, 107, 53, 0.07);
    }

    .placeholder-icon svg {
      width: 19px;
      height: 19px;
    }

    .placeholder-title {
      margin: 0;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .placeholder-note {
      margin: 0;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.45;
    }

    footer {
      max-width: 400px;
      margin: 34px auto 0;
      color: #514e4b;
      font-size: 10.5px;
      line-height: 1.6;
      text-align: center;
    }
  </style>
</head>
<body data-delivery-state="waiting-video" data-tracking-state="waiting-tracking">
  <main class="page">
    <section class="video-wrap" aria-label="Video presentation">
      <!-- waiting-video: replace this neutral box only when the official VTurb embed is supplied. -->
      <div class="video-placeholder" role="img" aria-label="Video presentation pending">
        <div class="placeholder-content">
          <span class="placeholder-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M7 5.5h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-9a2 2 0 0 1 2-2Z"/>
              <path d="m10 9 4.5 3-4.5 3V9Z"/>
            </svg>
          </span>
          <p class="placeholder-title">Video presentation</p>
          <p class="placeholder-note">The official video will be added here.</p>
        </div>
      </div>
    </section>

    <!-- No CTA: the future offer button is controlled by the official VTurb player. -->
    <footer>
      © 2026 Second Chance Formula — All rights reserved.
    </footer>
  </main>
</body>
</html>
