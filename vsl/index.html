<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="The Second Chance Formula presentation.">
  <title>The Second Chance Formula</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='8' fill='%23c9312a'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0e0f13;
      --bg-card: #15171f;
      --bg-card-2: #1b1e28;
      --ember-1: #ff6b35;
      --ember-2: #c9312a;
      --text: #f5f1ea;
      --text-dim: #9c9894;
      --text-dim-2: #6e6b68;
      --line: rgba(245, 241, 234, .08);
      --shadow: 0 20px 50px rgba(0, 0, 0, .45);
    }

    * { box-sizing: border-box; }
    html { background: var(--bg); }
    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
      background: radial-gradient(circle at 50% 0%, rgba(255, 107, 53, .08), transparent 45%), var(--bg);
      color: var(--text);
      font-family: Inter, Arial, sans-serif;
    }

    .page {
      width: 100%;
      min-height: 100vh;
      padding: 43px 18px 72px;
    }

    .column {
      width: min(400px, 100%);
      margin-left: max(0px, calc((100vw - 1140px) / 2 + 22px));
    }

    .player {
      position: relative;
      width: 100%;
      aspect-ratio: 400 / 921;
      overflow: hidden;
      border-radius: 14px;
      background: #050506;
      box-shadow: var(--shadow);
    }

    /* Captured initial player frame from razeresearch.com/razef; no competitor player or tracking is reused. */
    .player-frame {
      position: absolute;
      width: 360%;
      max-width: none;
      height: auto;
      top: -4.78%;
      left: -47.5%;
      display: block;
      pointer-events: none;
      user-select: none;
    }

    .player::after {
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      height: 13px;
      content: "";
      background: linear-gradient(90deg, #d81717 0 31%, rgba(199, 25, 25, .25) 31% 100%);
    }

    footer {
      /* The source retains the reserved space for its delayed panels before the footer. */
      margin-top: 248px;
      color: #514e4b;
      font-size: 10.5px;
      line-height: 1.6;
      text-align: center;
    }

    @media (max-width: 767px) {
      .page { padding: 43px 33px 60px; }
      .column { width: 100%; margin: 0 auto; }
    }
  </style>
</head>
<body data-delivery-state="waiting-video" data-tracking-state="waiting-tracking">
  <main class="page">
    <div class="column">
      <section class="player" aria-label="The Second Chance Formula video presentation">
        <img class="player-frame" src="../output/playwright/original-1440-full.png" alt="The Second Chance Formula video presentation preview">
      </section>

      <footer>© 2026 The Second Chance Formula — All rights reserved.</footer>
    </div>
  </main>
</body>
</html>
